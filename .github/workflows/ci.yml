name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      server: ${{ steps.paths.outputs.server }}
      web: ${{ steps.paths.outputs.web }}
      docker: ${{ steps.paths.outputs.docker }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Detect changed paths
        id: paths
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            workflow: &workflow
              - '.github/workflows/ci.yml'
            deps: &deps
              - 'package.json'
              - 'package-lock.json'
            server:
              - *workflow
              - *deps
              - 'src/**'
              - 'tests/**'
              - 'drizzle/**'
              - 'tsconfig*.json'
              - 'vite.config.ts'
              - 'eslint.config*.js'
            web:
              - *workflow
              - *deps
              - 'apps/web/**'
              # apps/web imports src/types/constants.ts via @petbot/constants
              - 'src/types/**'
              - 'eslint.config.base.js'
            docker:
              - *workflow
              - *deps
              - 'Dockerfile'
              - '.dockerignore'
              - 'entrypoint-bot.sh'
              - 'src/**'
              - 'apps/web/**'
              - 'drizzle/**'
              - 'tsconfig*.json'
              - 'changelog.md'
              - 'privacy.md'
              - 'terms.md'

  test:
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' || needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Run Bearer security scan
        uses: bearer/bearer-action@v2
        with:
          diff: true
          severity: "medium,high,critical"

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup npm
        run: npm install -g npm@11.16.0

      - name: Install dependencies (root)
        run: npm ci --no-audit --no-fund

      - name: Restore Next.js build cache
        if: needs.changes.outputs.web == 'true'
        uses: actions/cache@v6.1.0
        with:
          path: apps/web/.next
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json', 'apps/web/package.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Prebuild frontend (apps/web)
        if: needs.changes.outputs.web == 'true'
        run: npm --prefix apps/web run build

      - name: Build (server-only)
        if: needs.changes.outputs.server == 'true'
        run: npm run build:server

      - name: Run tests:server
        if: needs.changes.outputs.server == 'true'
        run: npm run test:ci

      - name: Run tests:web
        if: needs.changes.outputs.web == 'true'
        run: npm run test:web:ci

  docker-build:
    name: Validate Docker build (bot + web)
    needs: [changes, test]
    # !failure() lets this run when test is skipped, e.g. a Dockerfile-only change.
    if: ${{ !failure() && !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.docker == 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        target: [bot, web]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Validate build — ${{ matrix.target }} (${{ matrix.arch }})
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          push: false
          # Same scopes as publish-ghcr.yml so PRs start from main's cache.
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.arch }}
